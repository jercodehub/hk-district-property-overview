<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港地區物業概覽 | HK District Property Overview</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e8eef5;
      --text-muted: #8b9bb4;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    .header {
      height: 52px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
    }
    .menu-btn {
      background: none; border: none; color: var(--text);
      font-size: 22px; cursor: pointer; padding: 4px 8px;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header .subtitle { font-size: 11px; color: var(--text-muted); }
    .layout { display: flex; height: calc(100vh - 52px); position: relative; }
    .sidebar {
      width: 260px; background: var(--panel); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 12px; transition: transform 0.25s ease; z-index: 1001;
    }
    .sidebar.hidden { transform: translateX(-100%); position: absolute; height: 100%; }
    .sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; }
    .district-btn {
      display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 3px;
      background: transparent; border: none; border-radius: 6px; color: var(--text);
      cursor: pointer; font-size: 14px;
    }
    .district-btn:hover, .district-btn.active { background: var(--accent); }
    .region-label { font-size: 11px; color: var(--text-muted); margin: 14px 0 6px; text-transform: uppercase; }
    .map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }
    .legend {
      position: absolute; bottom: 16px; left: 12px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; z-index: 1000; font-size: 11px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .stats { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2000; background: var(--panel); padding: 20px; border-radius: 8px; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.4; }
    @media (max-width: 768px) {
      .sidebar { position: absolute; height: 100%; }
      .sidebar.hidden { transform: translateX(-100%); }
      .legend { bottom: 70px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div>
      <h1>香港地區物業概覽</h1>
      <div class="subtitle">District Property Overview · 全港私樓資料（屋宇署）</div>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <h2>選擇地區</h2>
      <div class="region-label">香港島</div>
      <button class="district-btn" data-district="中西區">中西區</button>
      <button class="district-btn" data-district="灣仔區">灣仔區</button>
      <button class="district-btn" data-district="東區">東區</button>
      <button class="district-btn" data-district="南區">南區</button>
      <div class="region-label">九龍</div>
      <button class="district-btn" data-district="油尖旺區">油尖旺區</button>
      <button class="district-btn" data-district="深水埗區">深水埗區</button>
      <button class="district-btn" data-district="九龍城區">九龍城區</button>
      <button class="district-btn" data-district="黃大仙區">黃大仙區</button>
      <button class="district-btn" data-district="觀塘區">觀塘區</button>
      <div class="region-label">新界</div>
      <button class="district-btn active" data-district="沙田區">沙田區</button>
      <button class="district-btn" data-district="大埔區">大埔區</button>
      <button class="district-btn" data-district="北區">北區</button>
      <button class="district-btn" data-district="元朗區">元朗區</button>
      <button class="district-btn" data-district="屯門區">屯門區</button>
      <button class="district-btn" data-district="荃灣區">荃灣區</button>
      <button class="district-btn" data-district="葵青區">葵青區</button>
      <button class="district-btn" data-district="西貢區">西貢區</button>
      <button class="district-btn" data-district="離島區">離島區</button>
      <div class="stats" id="districtStats">載入數據中…</div>
    </div>
    <div class="map-container">
      <div id="map"></div>
      <div class="loading" id="loading">載入全港樓宇資料中…</div>
      <div class="legend">
        <div style="font-weight:600; margin-bottom:4px;">樓齡</div>
        <div class="legend-item"><div class="dot" style="background:#10b981"></div> 20年以下</div>
        <div class="legend-item"><div class="dot" style="background:#f59e0b"></div> 20–40年</div>
        <div class="legend-item"><div class="dot" style="background:#ef4444"></div> 40年以上</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const districts = {
      "沙田區": { center: [22.38, 114.19], zoom: 13 },
      "中西區": { center: [22.28, 114.15], zoom: 15 },
      "灣仔區": { center: [22.28, 114.17], zoom: 15 },
      "東區": { center: [22.28, 114.22], zoom: 14 },
      "南區": { center: [22.24, 114.16], zoom: 13 },
      "油尖旺區": { center: [22.31, 114.17], zoom: 15 },
      "深水埗區": { center: [22.33, 114.16], zoom: 15 },
      "九龍城區": { center: [22.33, 114.19], zoom: 15 },
      "黃大仙區": { center: [22.34, 114.20], zoom: 15 },
      "觀塘區": { center: [22.32, 114.23], zoom: 14 },
      "大埔區": { center: [22.45, 114.17], zoom: 13 },
      "北區": { center: [22.50, 114.13], zoom: 13 },
      "元朗區": { center: [22.44, 114.03], zoom: 13 },
      "屯門區": { center: [22.39, 113.98], zoom: 13 },
      "荃灣區": { center: [22.37, 114.12], zoom: 14 },
      "葵青區": { center: [22.36, 114.13], zoom: 14 },
      "西貢區": { center: [22.38, 114.27], zoom: 12 },
      "離島區": { center: [22.26, 113.95], zoom: 12 }
    };

    const map = L.map('map', { zoomControl: true }).setView([22.38, 114.19], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    let allData = {};
    let clusterGroup = null;

    function finiteNum(value) {
      const n = typeof value === 'number' ? value : Number(value);
      return Number.isFinite(n) ? n : null;
    }
    function usableBuilding(b) {
      if (!b || typeof b !== 'object') return null;
      const lat = finiteNum(b.lat);
      const lng = finiteNum(b.lng);
      const year = finiteNum(b.year);
      if (lat == null || lng == null || year == null) return null;
      if (lat < 22 || lat > 23 || lng < 113 || lng > 115) return null;
      return { addr: b.addr, type: b.type, year: year, lat: lat, lng: lng };
    }
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }
    function getAge(year) {
      if (!Number.isFinite(year)) return null;
      return new Date().getFullYear() - year;
    }
    function getAgeColor(year) {
      const age = getAge(year);
      if (age == null) return '#94a3b8';
      if (age < 20) return '#10b981';
      if (age < 40) return '#f59e0b';
      return '#ef4444';
    }

    function loadDistrict(district) {
      if (clusterGroup) map.removeLayer(clusterGroup);
      clusterGroup = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false
      });

      const buildings = (Array.isArray(allData[district]) ? allData[district] : [])
        .map(usableBuilding)
        .filter(Boolean);
      buildings.forEach(b => {
        const age = getAge(b.year);
        const marker = L.circleMarker([b.lat, b.lng], {
          radius: 6,
          fillColor: getAgeColor(b.year),
          color: '#fff',
          weight: 1,
          opacity: 1,
          fillOpacity: 0.8
        });
        marker.bindPopup(`
          <b>${esc(b.addr || '樓宇')}</b><br>
          類型：${esc(b.type || '—')}<br>
          佔用許可年份：${esc(b.year)}<br>
          估算樓齡：${age == null ? '—' : esc(age)} 年
        `);
        clusterGroup.addLayer(marker);
      });

      map.addLayer(clusterGroup);

      const d = districts[district];
      if (d) map.setView(d.center, d.zoom);

      const avgAge = buildings.length
        ? Math.round(buildings.reduce((s, b) => s + getAge(b.year), 0) / buildings.length)
        : 0;
      document.getElementById('districtStats').innerHTML = `
        <div><strong>${district}</strong></div>
        <div>樓宇數量：${buildings.length.toLocaleString()}</div>
        <div>平均樓齡：${avgAge || '—'} 年</div>
        <div style="margin-top:6px; font-size:11px; color:#8b9bb4;">數據來源：屋宇署樓宇資料及樓齡紀錄</div>
      `;

      document.querySelectorAll('.district-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.district === district);
      });
      if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');
    }

    document.querySelectorAll('.district-btn').forEach(btn => {
      btn.addEventListener('click', () => loadDistrict(btn.dataset.district));
    });

    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('hidden');
    });

    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');

    fetch('buildings.json')
      .then(r => {
        if (!r.ok) throw new Error('無法讀取樓宇資料（HTTP ' + r.status + '）');
        return r.text();
      })
      .then(text => {
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('樓宇資料不是有效的 JSON');
        }
        if (!data || typeof data !== 'object' || Array.isArray(data)) {
          throw new Error('樓宇資料格式不正確');
        }
        return data;
      })
      .then(data => {
        allData = data;
        document.getElementById('loading').style.display = 'none';
        loadDistrict('沙田區');
        setTimeout(() => map.invalidateSize(), 100);
      })
      .catch(err => {
        const message = err && err.message ? err.message : '未知錯誤';
        document.getElementById('loading').textContent = '載入失敗：' + message;
        document.getElementById('districtStats').textContent = '未能載入樓宇資料。';
        console.error(err);
      });
  </script>
</body>
</html>
