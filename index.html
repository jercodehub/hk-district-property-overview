<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港地區物業概覽 | HK District Property Overview</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e8eef5;
      --text-muted: #8b9bb4;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    .header {
      height: 52px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
    }
    .menu-btn {
      background: none; border: none; color: var(--text);
      font-size: 22px; cursor: pointer; padding: 4px 8px;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header .subtitle { font-size: 11px; color: var(--text-muted); }
    .layout { display: flex; height: calc(100vh - 52px); position: relative; }
    .sidebar {
      width: 260px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      transition: transform 0.25s ease; z-index: 1001;
    }
    .district-scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 12px 12px 8px; overscroll-behavior: contain; }
    .sidebar.hidden { transform: translateX(-100%); position: absolute; height: 100%; }
    .sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; }
    .district-btn {
      display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 3px;
      background: transparent; border: none; border-radius: 6px; color: var(--text);
      cursor: pointer; font-size: 14px;
    }
    .district-btn:hover, .district-btn.active { background: var(--accent); }
    .region-label { font-size: 11px; color: var(--text-muted); margin: 14px 0 6px; text-transform: uppercase; }
    .map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }
    .legend {
      position: absolute; bottom: 16px; left: 12px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; z-index: 1000; font-size: 11px;
      max-width: min(230px, calc(100% - 24px));
    }
    .legend-title { font-weight: 600; margin-bottom: 4px; }
    .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .legend-key {
      display: flex; gap: 8px; align-items: center; margin-top: 6px; padding-top: 6px;
      border-top: 1px solid var(--border);
    }
    .legend-key-icon { width: 44px; height: 44px; flex: none; }
    .legend-note { color: var(--text-muted); line-height: 1.35; font-size: 10px; }
    .stats {
      flex: none; margin-top: 0; padding: 10px 12px 12px; border-top: 1px solid var(--border);
      font-size: 12px; color: var(--text-muted); background: var(--panel);
    }
    .stats-title { color: var(--text); font-weight: 600; margin-bottom: 4px; }
    .band-heading { margin-top: 8px; margin-bottom: 2px; font-size: 11px; }
    .band-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--text); }
    .band-label { width: 62px; flex: none; color: var(--text-muted); }
    .band-bar { flex: 1; height: 6px; background: #243044; border-radius: 99px; overflow: hidden; min-width: 28px; }
    .band-bar > span { display: block; height: 100%; border-radius: 99px; }
    .band-n { min-width: 42px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
    .stats-source { margin-top: 8px; font-size: 11px; color: #8b9bb4; line-height: 1.4; }
    .age-cluster-icon { background: transparent !important; border: none !important; cursor: pointer; }
    .age-pie {
      width: 100%; height: 100%; border-radius: 50%; box-sizing: border-box;
      border: 1.5px solid #fff; padding: 12%; background-clip: padding-box;
      box-shadow: 0 1px 3px rgba(15, 20, 25, 0.45);
    }
    .age-pie-hole {
      width: 100%; height: 100%; border-radius: 50%; background: #1a2332;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      line-height: 1; pointer-events: none; user-select: none;
    }
    .age-avg { font-weight: 700; letter-spacing: -0.03em; }
    .age-num { font-size: 14px; }
    .age-num.is-long { font-size: 12px; }
    .age-unit { font-size: 9px; margin-left: 0.5px; }
    .age-count {
      margin-top: 1px; font-size: 10px; font-weight: 600; color: #d5deea;
      font-variant-numeric: tabular-nums;
    }
    .age-count.is-wide { font-size: 8px; letter-spacing: -0.04em; }
    .legend-key-icon .age-num { font-size: 12px; }
    .legend-key-icon .age-unit, .legend-key-icon .age-count { font-size: 8px; }
    .age-cluster-icon:hover .age-pie { transform: scale(1.06); }
    @media (prefers-reduced-motion: reduce) {
      .age-cluster-icon:hover .age-pie { transform: none; }
    }
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2000; background: var(--panel); padding: 20px; border-radius: 8px; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.4; }
    @media (max-width: 768px) {
      .sidebar { position: absolute; height: 100%; width: min(260px, 86vw); }
      .sidebar.hidden { transform: translateX(-100%); }
      .legend { bottom: 70px; left: 8px; font-size: 10px; padding: 8px 10px; }
      .legend-key-icon { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div>
      <h1>香港地區物業概覽</h1>
      <div class="subtitle">District Property Overview · 全港私樓資料（屋宇署）</div>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="district-scroll">
      <h2>選擇地區</h2>
      <div class="region-label">香港島</div>
      <button class="district-btn" data-district="中西區">中西區</button>
      <button class="district-btn" data-district="灣仔區">灣仔區</button>
      <button class="district-btn" data-district="東區">東區</button>
      <button class="district-btn" data-district="南區">南區</button>
      <div class="region-label">九龍</div>
      <button class="district-btn" data-district="油尖旺區">油尖旺區</button>
      <button class="district-btn" data-district="深水埗區">深水埗區</button>
      <button class="district-btn" data-district="九龍城區">九龍城區</button>
      <button class="district-btn" data-district="黃大仙區">黃大仙區</button>
      <button class="district-btn" data-district="觀塘區">觀塘區</button>
      <div class="region-label">新界</div>
      <button class="district-btn active" data-district="沙田區">沙田區</button>
      <button class="district-btn" data-district="大埔區">大埔區</button>
      <button class="district-btn" data-district="北區">北區</button>
      <button class="district-btn" data-district="元朗區">元朗區</button>
      <button class="district-btn" data-district="屯門區">屯門區</button>
      <button class="district-btn" data-district="荃灣區">荃灣區</button>
      <button class="district-btn" data-district="葵青區">葵青區</button>
      <button class="district-btn" data-district="西貢區">西貢區</button>
      <button class="district-btn" data-district="離島區">離島區</button>
      </div>
      <div class="stats" id="districtStats">載入數據中…</div>
    </div>
    <div class="map-container">
      <div id="map"></div>
      <div class="loading" id="loading">載入全港樓宇資料中…</div>
      <div class="legend">
        <div class="legend-title">樓齡</div>
        <div class="legend-item"><div class="dot" style="background:#10b981"></div> 20年以下</div>
        <div class="legend-item"><div class="dot" style="background:#f59e0b"></div> 20–40年</div>
        <div class="legend-item"><div class="dot" style="background:#ef4444"></div> 40年以上</div>
        <div class="legend-key">
          <div class="legend-key-icon" aria-hidden="true">
            <div class="age-pie" style="background: conic-gradient(#10b981 0 33%, #f59e0b 33% 66%, #ef4444 66% 100%)">
              <div class="age-pie-hole">
                <div class="age-avg" style="color:#f59e0b"><span class="age-num">29</span><span class="age-unit">年</span></div>
                <div class="age-count">120</div>
              </div>
            </div>
          </div>
          <div class="legend-note">大字：平均樓齡<br>細字：樓宇幢數<br>圓環：樓齡比例<br>點擊可放大</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const districts = {
      "沙田區": { center: [22.38, 114.19], zoom: 13 },
      "中西區": { center: [22.28, 114.15], zoom: 15 },
      "灣仔區": { center: [22.28, 114.17], zoom: 15 },
      "東區": { center: [22.28, 114.22], zoom: 14 },
      "南區": { center: [22.24, 114.16], zoom: 13 },
      "油尖旺區": { center: [22.31, 114.17], zoom: 15 },
      "深水埗區": { center: [22.33, 114.16], zoom: 15 },
      "九龍城區": { center: [22.33, 114.19], zoom: 15 },
      "黃大仙區": { center: [22.34, 114.20], zoom: 15 },
      "觀塘區": { center: [22.32, 114.23], zoom: 14 },
      "大埔區": { center: [22.45, 114.17], zoom: 13 },
      "北區": { center: [22.50, 114.13], zoom: 13 },
      "元朗區": { center: [22.44, 114.03], zoom: 13 },
      "屯門區": { center: [22.39, 113.98], zoom: 13 },
      "荃灣區": { center: [22.37, 114.12], zoom: 14 },
      "葵青區": { center: [22.36, 114.13], zoom: 14 },
      "西貢區": { center: [22.38, 114.27], zoom: 12 },
      "離島區": { center: [22.26, 113.95], zoom: 12 }
    };

    const map = L.map('map', { zoomControl: true }).setView([22.38, 114.19], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    let allData = {};
    let clusterGroup = null;

    const AGE_BANDS = [
      { key: 'young', color: '#10b981', label: '20年以下' },
      { key: 'mid', color: '#f59e0b', label: '20–40年' },
      { key: 'old', color: '#ef4444', label: '40年以上' }
    ];

    function finiteNum(value) {
      const n = typeof value === 'number' ? value : Number(value);
      return Number.isFinite(n) ? n : null;
    }
    function usableBuilding(b) {
      if (!b || typeof b !== 'object') return null;
      const lat = finiteNum(b.lat);
      const lng = finiteNum(b.lng);
      const year = finiteNum(b.year);
      if (lat == null || lng == null || year == null) return null;
      if (lat < 22 || lat > 23 || lng < 113 || lng > 115) return null;
      return { addr: b.addr, type: b.type, year: year, lat: lat, lng: lng };
    }
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }
    function getAge(year) {
      if (!Number.isFinite(year)) return null;
      return new Date().getFullYear() - year;
    }
    function bandKey(age) {
      if (age < 20) return 'young';
      if (age < 40) return 'mid';
      return 'old';
    }
    function getAgeColor(year) {
      const age = getAge(year);
      if (age == null) return '#94a3b8';
      return AGE_BANDS.find(band => band.key === bandKey(age)).color;
    }
    function emptyCounts() {
      return { young: 0, mid: 0, old: 0 };
    }
    function summarizeAges(ages) {
      const counts = emptyCounts();
      let sum = 0;
      for (const age of ages) {
        if (age == null) continue;
        sum += age;
        counts[bandKey(age)]++;
      }
      const total = counts.young + counts.mid + counts.old;
      return {
        counts,
        total,
        avg: total ? Math.round(sum / total) : null
      };
    }
    function ageColorForAverage(avg) {
      if (avg == null) return '#94a3b8';
      return AGE_BANDS.find(band => band.key === bandKey(avg)).color;
    }
    function conicGradient(counts, total) {
      if (!total) return '#64748b';
      let cursor = 0;
      const stops = [];
      for (const band of AGE_BANDS) {
        const n = counts[band.key];
        if (!n) continue;
        const start = (cursor / total) * 100;
        cursor += n;
        const end = (cursor / total) * 100;
        stops.push(`${band.color} ${start.toFixed(2)}% ${end.toFixed(2)}%`);
      }
      return `conic-gradient(${stops.join(',')})`;
    }
    function clusterRadiusForZoom(zoom) {
      if (zoom <= 12) return 72;
      if (zoom === 13) return 62;
      if (zoom === 14) return 56;
      if (zoom === 15) return 58;
      return 46;
    }
    function clusterIconSize(zoom) {
      if (zoom >= 16) return 40;
      if (zoom >= 15) return 44;
      return 50;
    }
    function createAgeClusterIcon(cluster) {
      const markers = cluster.getAllChildMarkers();
      const summary = summarizeAges(markers.map(marker => getAge(marker.options.year)));
      const count = cluster.getChildCount();
      const zoom = Number.isFinite(cluster._zoom) ? cluster._zoom : map.getZoom();
      const size = clusterIconSize(zoom);
      const avg = summary.avg;
      const avgColor = ageColorForAverage(avg);
      const avgHtml = avg == null
        ? '<span class="age-num">—</span>'
        : `<span class="age-num${avg >= 100 ? ' is-long' : ''}">${avg}</span><span class="age-unit">年</span>`;
      const label = `${count}幢` +
        (avg == null ? '' : `，平均${avg}年`) +
        `，20年以下${summary.counts.young}，20–40年${summary.counts.mid}，40年以上${summary.counts.old}`;
      const html = `<div class="age-pie" style="background:${conicGradient(summary.counts, summary.total)}" role="img" aria-label="${esc(label)}">
          <div class="age-pie-hole">
            <div class="age-avg" style="color:${avgColor}">${avgHtml}</div>
            <div class="age-count${count >= 1000 ? ' is-wide' : ''}">${count}</div>
          </div>
        </div>`;
      return L.divIcon({
        html,
        className: 'age-cluster-icon',
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
    }
    function renderDistrictStats(district, buildings) {
      const summary = summarizeAges(buildings.map(b => getAge(b.year)));
      const rows = AGE_BANDS.map(band => {
        const n = summary.counts[band.key];
        const pct = summary.total ? (n / summary.total) * 100 : 0;
        return `<div class="band-row">
          <span class="dot" style="background:${band.color}"></span>
          <span class="band-label">${band.label}</span>
          <span class="band-bar"><span style="width:${pct.toFixed(1)}%;background:${band.color}"></span></span>
          <span class="band-n">${n.toLocaleString('zh-HK')}</span>
        </div>`;
      }).join('');
      document.getElementById('districtStats').innerHTML = `
        <div class="stats-title">${esc(district)}</div>
        <div>樓宇數量：${buildings.length.toLocaleString('zh-HK')}</div>
        <div>平均樓齡：${summary.avg == null ? '—' : summary.avg + ' 年'}</div>
        <div class="band-heading">樓齡分布</div>
        ${rows}
        <div class="stats-source">數據來源：屋宇署樓宇資料及樓齡紀錄</div>
      `;
    }

    function loadDistrict(district) {
      if (clusterGroup) map.removeLayer(clusterGroup);
      const view = districts[district];
      if (view) map.setView(view.center, view.zoom);

      clusterGroup = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: clusterRadiusForZoom,
        disableClusteringAtZoom: 17,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
        iconCreateFunction: createAgeClusterIcon,
        spiderLegPolylineOptions: { weight: 1.5, color: '#334155', opacity: 0.75 }
      });

      const buildings = (Array.isArray(allData[district]) ? allData[district] : [])
        .map(usableBuilding)
        .filter(Boolean);
      const markers = buildings.map(b => {
        const age = getAge(b.year);
        const marker = L.circleMarker([b.lat, b.lng], {
          radius: 6,
          fillColor: getAgeColor(b.year),
          color: '#fff',
          weight: 1,
          opacity: 1,
          fillOpacity: 0.85,
          year: b.year
        });
        marker.bindPopup(`
          <b>${esc(b.addr || '樓宇')}</b><br>
          類型：${esc(b.type || '—')}<br>
          佔用許可年份：${esc(b.year)}<br>
          估算樓齡：${age == null ? '—' : esc(age)} 年
        `);
        return marker;
      });
      clusterGroup.addLayers(markers);
      map.addLayer(clusterGroup);
      renderDistrictStats(district, buildings);

      document.querySelectorAll('.district-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.district === district);
      });
      if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');
    }

    document.querySelectorAll('.district-btn').forEach(btn => {
      btn.addEventListener('click', () => loadDistrict(btn.dataset.district));
    });

    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('hidden');
    });

    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');

    fetch('buildings.json')
      .then(r => {
        if (!r.ok) throw new Error('無法讀取樓宇資料（HTTP ' + r.status + '）');
        return r.text();
      })
      .then(text => {
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('樓宇資料不是有效的 JSON');
        }
        if (!data || typeof data !== 'object' || Array.isArray(data)) {
          throw new Error('樓宇資料格式不正確');
        }
        return data;
      })
      .then(data => {
        allData = data;
        document.getElementById('loading').style.display = 'none';
        loadDistrict('沙田區');
        setTimeout(() => map.invalidateSize(), 100);
      })
      .catch(err => {
        const message = err && err.message ? err.message : '未知錯誤';
        document.getElementById('loading').textContent = '載入失敗：' + message;
        document.getElementById('districtStats').textContent = '未能載入樓宇資料。';
        console.error(err);
      });
  </script>
</body>
</html>
